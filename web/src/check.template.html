<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<!-- 严格 CSP：脚本只许同源（无 'unsafe-inline'，故脚本外置）；外联只许同源 + Worker。
     即使页面被注入标记也无法执行新脚本、无法把密钥外发到攻击者域名。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' {{WORKER_URL}}; base-uri 'none'; form-action 'none'">
<title>searchX · 事实核查</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/feed.css">
<link rel="stylesheet" href="assets/check.css">
</head>
<body data-pagefind-ignore data-worker="{{WORKER_URL}}">
  <div class="wrap">
    <header class="ck-top">
      <div class="ck-brand">事实核查<small>FACTCHECK</small></div>
      <button type="button" class="ck-gear" id="settings-open" aria-label="设置" title="设置" hidden>⚙︎</button>
    </header>

    <!-- 密钥闸：输对 CHECK_KEY 之前只显示这个，表单不加载 -->
    <div id="gate" class="ck-gate">
      <p class="modal-lead">输入密钥进入。只有持密钥的你能提交核查。</p>
      <input id="check-key" class="ck-input" type="password" autocomplete="off" placeholder="密钥" aria-label="密钥">
      <p style="margin-top:.7rem"><button id="enter" class="ck-submit" type="button">进入</button></p>
      <p id="gate-msg" class="form-status" role="status" aria-live="polite" hidden></p>
    </div>

    <!-- 密钥正确后显示 -->
    <div id="form-area" hidden>
      <!-- 列表视图：输入箱 + 最近核查（点某条已完成切到 result-view） -->
      <div id="list-view">
        <div id="recheck-banner" class="recheck-banner" hidden>
          <span>补充证据重查：</span><b id="recheck-title"></b><button type="button" id="recheck-cancel">取消</button>
        </div>
        <form id="check-form" class="composer" novalidate>
          <textarea id="check-text" rows="3" placeholder="贴消息、说法或链接；截图可直接粘贴，或点下面「图片」" aria-label="核查内容"></textarea>
          <div id="attach" class="attach" aria-live="polite"></div>
          <div class="composer-bar">
            <div class="composer-tools">
              <button type="button" class="tool-btn" id="pick-images">🖼 图片</button>
              <input id="check-images" type="file" accept="image/*" multiple hidden>
            </div>
            <button id="submit-btn" class="ck-submit" type="submit">提交核查</button>
          </div>
        </form>
        <p class="ck-hint" id="composer-hint">文字、链接、截图至少一样。通常 5–10 分钟出结果，下方「最近核查」会显示进度。</p>
        <p id="form-status" class="form-status ck-status" role="status" aria-live="polite" hidden></p>

        <div class="ck-sec">
          <b>最近核查</b>
          <span class="ck-sec-tools">
            <span id="recent-synced" role="status" aria-live="polite" hidden></span>
            <button type="button" class="linklike" id="recent-refresh">刷新</button>
          </span>
        </div>
        <div id="recent-list" class="task-list" aria-live="polite"></div>
        <p class="ck-foot"><button type="button" class="linklike" id="settings-open-foot">设置 · 退出</button></p>
      </div><!-- /list-view -->

      <!-- 结果详情：裁定头卡 + 正文 + 底部操作 -->
      <div id="result-view" hidden>
        <button type="button" class="linklike ck-back" id="result-back">← 返回</button>
        <p id="result-title" class="vh-title" hidden></p>
        <div id="result-hero" class="verdict-hero" hidden></div>
        <article id="result-body" class="prose"></article>
        <div class="result-dock" id="result-dock" hidden>
          <a id="result-obsidian" class="ghost-btn" href="#" hidden>在 Obsidian 打开</a>
          <button type="button" id="result-recheck" class="ck-submit">补充证据 · 重查</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 设置面板 -->
  <div id="settings" class="ck-sheet-backdrop" hidden>
    <div class="ck-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-h">
      <h2 id="settings-h">设置</h2>
      <label class="field">
        <span class="field-label">Obsidian 库名</span>
        <input id="vault-name" class="ck-input" type="text" autocomplete="off" placeholder="例如：饺子的旷野">
      </label>
      <p class="ck-fine">填了才会在结果页显示「在 Obsidian 打开」（用 obsidian:// 深链打开这台设备上同名库里的那篇笔记）。只存在本机浏览器。</p>
      <div class="ck-sheet-acts">
        <button type="button" class="ck-danger" id="logout">退出并清除本机密钥</button>
        <span>
          <button type="button" class="ghost-btn" id="settings-close">关闭</button>
          <button type="button" class="ck-submit" id="settings-save">保存</button>
        </span>
      </div>
    </div>
  </div>

  <!-- 外置脚本（配合 script-src 'self'）：DOM 引导在 assets/check-page.js，纯逻辑在 assets/check.js -->
  <script type="module" src="assets/check-page.js"></script>
</body>
</html>
